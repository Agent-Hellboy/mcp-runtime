apiVersion: mcpruntime.org/v1alpha1
kind: MCPServer
metadata:
  name: mcp-auth-sdk-ping-py
  namespace: mcp-servers
spec:
  description: Standalone MCP resource server using the mcp-auth Python SDK.
  image: mcp-auth-sdk-ping-py:latest
  imageTag: latest
  port: 8088
  servicePort: 80
  publicPathPrefix: mcp-auth-sdk-ping-py
  ingressClass: traefik
  auth:
    mode: oauth
    issuerURL: http://localhost:18080/mcp-auth
    audience: http://localhost:18080/mcp-auth-sdk-ping-py/mcp
  gateway:
    enabled: false
  envVars:
    - name: MCP_PATH
      value: /mcp-auth-sdk-ping-py/mcp
    - name: MCP_AUTH_ISSUER
      value: http://localhost:18080/mcp-auth
    - name: MCP_AUTH_RESOURCE
      value: http://localhost:18080/mcp-auth-sdk-ping-py/mcp
    - name: MCP_AUTH_RESOURCE_METADATA_URL
      value: http://localhost:18080/.well-known/oauth-protected-resource/mcp-auth-sdk-ping-py/mcp
    # Kind only. The SDK derives <issuer>/.well-known/jwks.json by default, and
    # on a real deployment the public HTTPS issuer is reachable from inside the
    # cluster, so omit both of these and let it fetch over TLS. They exist here
    # because the Kind ingress is not resolvable from inside a pod; the plain
    # HTTP endpoint then needs MCP_AUTH_JWKS_SSRF_SAFE=false, which must never
    # be set for a URL that leaves the cluster.
    - name: MCP_AUTH_JWKS_URL
      value: http://mcp-auth-server.mcp-sentinel.svc.cluster.local:8080/.well-known/jwks.json
    - name: MCP_AUTH_JWKS_SSRF_SAFE
      value: "false"
  tools:
    - name: sdk-ping-py
      description: Return pong after Python SDK verification.
      requiredTrust: low
      sideEffect: read
      riskLevel: low
