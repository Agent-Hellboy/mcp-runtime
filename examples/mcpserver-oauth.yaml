# OAuth-protected MCP server (spec.auth.mode: oauth).
#
# The gateway becomes an OAuth 2.1 protected resource in front of this server:
# unauthenticated requests get 401 with a WWW-Authenticate challenge pointing at
# the protected-resource metadata, and MCP clients discover the authorization
# server from there.
#
# Before applying, replace `example.org` with your MCP_PLATFORM_DOMAIN and point
# `image` at your registry.
#
# Two fields have to agree with the deployment or discovery breaks:
#
#   auth.issuerURL  must match OAUTH_ISSUER_URL in mcp-sentinel-config. The
#                   ingress routes the OAuth server by path on the platform
#                   host, so the issuer keeps its /oauth path component.
#
#   auth.audience   must be the canonical MCP resource URI of THIS server -
#                   scheme, host and the full route path. The gateway rejects
#                   tokens whose `aud` does not match, so a value that omits
#                   the path or uses the wrong host fails closed with 401.
apiVersion: mcpruntime.org/v1alpha1
kind: MCPServer
metadata:
  name: oauth-workspace-assistant
  namespace: mcp-servers
spec:
  description: OAuth-protected workspace assistant, used to exercise the MCP authorization flow end to end.
  image: registry.example.org/workspace-assistant-mcp
  imageTag: latest
  port: 8090
  servicePort: 80
  publicPathPrefix: oauth-workspace-assistant
  ingressClass: traefik
  ingressAnnotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
  envVars:
    - name: PORT
      value: "8090"
    - name: MCP_PATH
      value: /oauth-workspace-assistant/mcp
  auth:
    mode: oauth
    tokenHeader: Authorization
    humanIDHeader: X-MCP-Human-ID
    agentIDHeader: X-MCP-Agent-ID
    sessionIDHeader: X-MCP-Agent-Session
    issuerURL: https://platform.example.org/oauth
    audience: https://mcp.example.org/oauth-workspace-assistant/mcp
  policy:
    mode: allow-list
    defaultDecision: deny
    policyVersion: v1
  session:
    required: false
  gateway:
    enabled: true
    resources:
      requests:
        cpu: 1m
        memory: 32Mi
  tools:
    - name: aaa-ping
      description: Check that the server is reachable.
      requiredTrust: low
      sideEffect: read
      riskLevel: low
    - name: add
      description: Add two numeric values.
      requiredTrust: low
      sideEffect: read
      riskLevel: low
    - name: echo
      description: Echo a message for transport debugging.
      requiredTrust: low
      sideEffect: read
      riskLevel: low
    - name: upper
      description: Convert text to uppercase.
      requiredTrust: medium
      sideEffect: read
      riskLevel: medium
    - name: lower
      description: Convert text to lowercase.
      requiredTrust: low
      sideEffect: read
      riskLevel: low
    - name: slugify
      description: Convert a title into a URL-safe slug.
      requiredTrust: low
      sideEffect: read
      riskLevel: low
    - name: create_task
      description: Create a deterministic task card summary.
      requiredTrust: low
      sideEffect: write
      riskLevel: medium
    - name: draft_release_note
      description: Draft a compact release note from a change summary.
      requiredTrust: low
      sideEffect: read
      riskLevel: low
