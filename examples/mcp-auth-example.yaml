apiVersion: mcpruntime.org/v1alpha1
kind: MCPServer
metadata:
  name: mcp-auth-example
  namespace: mcp-servers
spec:
  description: Governed OAuth MCP example using the optional bundled mcp-auth authorization server.
  image: mcp-auth-example:latest
  port: 8088
  servicePort: 80
  publicPathPrefix: mcp-auth-example
  auth:
    mode: oauth
    issuerURL: http://localhost:18080/mcp-auth
    audience: http://localhost:18080/mcp-auth-example/mcp
  gateway:
    enabled: true
    port: 8091
    upstreamURL: http://127.0.0.1:8088
    stripPrefix: /mcp-auth-example
  policy:
    mode: allow-list
    defaultDecision: deny
    enforceOn: call_tool
    policyVersion: v1
  session:
    store: kubernetes
    headerName: X-MCP-Agent-Session
    # No upstreamTokenHeader: under auth.mode oauth the gateway strips the
    # caller's token instead of forwarding it, because the MCP authorization
    # spec forbids a resource server from passing its inbound token upstream.
    idleTimeout: 1h
    maxLifetime: 24h
  tools:
    - name: aaa-ping
      description: Check the authenticated MCP example.
      requiredTrust: low
      riskLevel: low
      sideEffect: read
