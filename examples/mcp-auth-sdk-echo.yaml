apiVersion: mcpruntime.org/v1alpha1
kind: MCPServer
metadata:
  name: mcp-auth-sdk-echo
  namespace: mcp-servers
spec:
  description: Standalone MCP resource server using the mcp-auth Go SDK.
  image: mcp-auth-sdk-echo:latest
  imageTag: latest
  port: 8088
  servicePort: 80
  publicPathPrefix: mcp-auth-sdk-echo
  ingressClass: traefik
  auth:
    mode: oauth
    issuerURL: http://localhost:18080/mcp-auth
    audience: http://localhost:18080/mcp-auth-sdk-echo/mcp
  gateway:
    enabled: false
  envVars:
    # The public issuer is not reachable from inside a pod, so the verifier is
    # pointed straight at the in-cluster JWKS endpoint. Issuer and audience are
    # still validated against the public values above.
    - name: MCP_AUTH_JWKS_URL
      value: http://mcp-auth-server.mcp-sentinel.svc.cluster.local:8080/.well-known/jwks.json
  tools:
    - name: sdk-echo
      description: Echo a message after SDK verification.
      requiredTrust: low
      sideEffect: read
      riskLevel: low
