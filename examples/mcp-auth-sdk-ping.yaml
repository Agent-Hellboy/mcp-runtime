apiVersion: mcpruntime.org/v1alpha1
kind: MCPServer
metadata:
  name: mcp-auth-sdk-ping
  namespace: mcp-servers
spec:
  description: Standalone MCP resource server using the mcp-auth Go SDK.
  image: mcp-auth-sdk-ping:latest
  imageTag: latest
  port: 8088
  servicePort: 80
  publicPathPrefix: mcp-auth-sdk-ping
  ingressClass: traefik
  auth:
    mode: oauth
    issuerURL: http://localhost:18080/mcp-auth
    audience: http://localhost:18080/mcp-auth-sdk-ping/mcp
  gateway:
    enabled: false
  envVars:
    # Kind only. On a real deployment the public HTTPS issuer is reachable from
    # inside the cluster, so omit this and let the SDK discover the JWKS over
    # TLS — the authorization server restricts ingress to the ingress
    # controller, so the in-cluster endpoint is not reachable from a workload
    # namespace anyway. Here the Kind ingress is not resolvable from a pod, so
    # the verifier is pointed at the in-cluster endpoint directly; issuer and
    # audience are still validated against the public values above.
    - name: MCP_AUTH_JWKS_URL
      value: http://mcp-auth-server.mcp-sentinel.svc.cluster.local:8080/.well-known/jwks.json
  tools:
    - name: sdk-ping
      description: Return pong after SDK verification.
      requiredTrust: low
      sideEffect: read
      riskLevel: low
