apiVersion: mcpruntime.org/v1alpha1
kind: MCPServer
metadata:
  name: mcp-auth-sdk-ping
  namespace: mcp-servers
spec:
  description: Standalone MCP resource server using the mcp-auth Go SDK.
  image: mcp-auth-sdk-ping:latest
  imageTag: latest
  port: 8088
  servicePort: 80
  publicPathPrefix: mcp-auth-sdk-ping
  ingressClass: traefik
  auth:
    mode: oauth
    issuerURL: http://localhost:18080/mcp-auth
    audience: http://localhost:18080/mcp-auth-sdk-ping/mcp
  gateway:
    enabled: false
  envVars:
    - name: MCP_PATH
      value: /mcp-auth-sdk-ping/mcp
    - name: MCP_AUTH_ISSUER
      value: http://localhost:18080/mcp-auth
    - name: MCP_AUTH_RESOURCE
      value: http://localhost:18080/mcp-auth-sdk-ping/mcp
    - name: MCP_AUTH_RESOURCE_METADATA_URL
      value: http://localhost:18080/.well-known/oauth-protected-resource/mcp-auth-sdk-ping/mcp
    - name: MCP_PATH
      value: /mcp-auth-sdk-ping/mcp
    - name: MCP_AUTH_DISCOVERY_ISSUER
      value: http://mcp-auth-server.mcp-sentinel.svc.cluster.local:8080
    - name: MCP_AUTH_INTERNAL_BASE_URL
      value: http://mcp-auth-server.mcp-sentinel.svc.cluster.local:8080
  tools:
    - name: sdk-ping
      description: Return pong after SDK verification.
      requiredTrust: low
      sideEffect: read
      riskLevel: low
