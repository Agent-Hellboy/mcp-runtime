name: Production E2E (Disposable VM)

on:
  workflow_dispatch:
    inputs:
      run-multitenancy:
        description: Run the destructive multi-team CLI/API scenario suite.
        required: true
        default: true
        type: boolean

concurrency:
  group: production-e2e-disposable-vm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build CLI for disposable VM
        run: go build -o bin/mcp-runtime ./cmd/mcp-runtime

      - name: Package repository
        run: |
          tar --exclude=.git --exclude='*/node_modules' \
            -czf /tmp/mcp-runtime-e2e.tgz .

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure pinned VM host key
        env:
          E2E_VM_KNOWN_HOSTS: ${{ secrets.E2E_VM_KNOWN_HOSTS }}
        run: |
          test -n "${E2E_VM_KNOWN_HOSTS}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${E2E_VM_KNOWN_HOSTS}" > ~/.ssh/mcp-runtime-e2e-known-hosts
          chmod 600 ~/.ssh/mcp-runtime-e2e-known-hosts

      - name: Upload repository to disposable VM
        env:
          SSHPASS: ${{ secrets.E2E_VM_PASSWORD }}
        run: |
          sshpass -e scp \
            -o UserKnownHostsFile="$HOME/.ssh/mcp-runtime-e2e-known-hosts" -o StrictHostKeyChecking=yes \
            /tmp/mcp-runtime-e2e.tgz \
            "${{ secrets.E2E_VM_USER }}@${{ secrets.E2E_VM_HOST }}:/tmp/mcp-runtime-e2e.tgz"

      - name: Ensure E2E runtime configuration
        env:
          E2E_ACME_EMAIL: ${{ secrets.E2E_ACME_EMAIL }}
          SSHPASS: ${{ secrets.E2E_VM_PASSWORD }}
        run: |
          test -n "${E2E_ACME_EMAIL}"
          printf 'E2E_ACME_EMAIL=%s\n' "${E2E_ACME_EMAIL}" | \
            sshpass -e ssh \
              -o UserKnownHostsFile="$HOME/.ssh/mcp-runtime-e2e-known-hosts" -o StrictHostKeyChecking=yes \
              "${{ secrets.E2E_VM_USER }}@${{ secrets.E2E_VM_HOST }}" \
              'set -eu; backup_dir=/var/lib/mcp-runtime-e2e-backup; env_file="$backup_dir/e2e.env"; install -d -m 700 "$backup_dir"; touch "$env_file"; chmod 600 "$env_file"; IFS= read -r line; tmp="${env_file}.tmp"; awk -F= -v replacement="$line" '\''$1 != "E2E_ACME_EMAIL" { print } END { print replacement }'\'' "$env_file" > "$tmp"; mv "$tmp" "$env_file"'

      - name: Run production E2E
        env:
          SSHPASS: ${{ secrets.E2E_VM_PASSWORD }}
          RUN_MULTITENANCY: ${{ inputs.run-multitenancy }}
        run: |
          # Setup has multi-minute silent stretches while it builds images, and
          # an idle SSH session that drops there fails the job with exit 255
          # while the remote run keeps going -- a false negative that also
          # leaves the VM dirty. Keep the connection alive across those gaps.
          sshpass -e ssh \
            -o UserKnownHostsFile="$HOME/.ssh/mcp-runtime-e2e-known-hosts" -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes \
            "${{ secrets.E2E_VM_USER }}@${{ secrets.E2E_VM_HOST }}" \
            "set -eu; rm -rf /opt/mcp-runtime-e2e; mkdir -p /opt/mcp-runtime-e2e; tar -xzf /tmp/mcp-runtime-e2e.tgz -C /opt/mcp-runtime-e2e; E2E_RUN_MULTITENANCY='${RUN_MULTITENANCY}' bash /opt/mcp-runtime-e2e/test/e2e/production-vm.sh"

      - name: Collect E2E artifacts
        if: always()
        env:
          SSHPASS: ${{ secrets.E2E_VM_PASSWORD }}
        run: |
          mkdir -p e2e-artifacts
          sshpass -e scp -r \
            -o UserKnownHostsFile="$HOME/.ssh/mcp-runtime-e2e-known-hosts" -o StrictHostKeyChecking=yes \
            "${{ secrets.E2E_VM_USER }}@${{ secrets.E2E_VM_HOST }}:/var/lib/mcp-runtime-e2e-backup/runs" \
            e2e-artifacts/ || true

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-e2e-artifacts
          path: e2e-artifacts
