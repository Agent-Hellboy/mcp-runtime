name: Security - Gitleaks

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.0"
          cache: false

      - name: Install Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.29.1

      - name: Scan Git history
        run: "$(go env GOPATH)/bin/gitleaks git --config .gitleaks.toml --redact --verbose ."
