name: Production E2E (Remote Cluster)

on:
  workflow_dispatch:
    inputs:
      run-multitenancy:
        description: Run the destructive multi-team CLI/API scenario suite.
        required: true
        default: true
        type: boolean

# Shared with the on-VM workflow: both drive the same disposable VM, so they
# must never run at the same time.
concurrency:
  group: production-e2e-disposable-vm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production-e2e-remote:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure pinned VM host key
        env:
          E2E_VM_KNOWN_HOSTS: ${{ secrets.E2E_VM_KNOWN_HOSTS }}
        run: |
          test -n "${E2E_VM_KNOWN_HOSTS}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${E2E_VM_KNOWN_HOSTS}" > ~/.ssh/mcp-runtime-e2e-known-hosts
          chmod 600 ~/.ssh/mcp-runtime-e2e-known-hosts

      # The CLI runs here and reaches the cluster over its kubeconfig, so the
      # repository never leaves the runner and artifacts are already local.
      - name: Run remote production E2E
        env:
          E2E_VM_HOST: ${{ secrets.E2E_VM_HOST }}
          E2E_VM_USER: ${{ secrets.E2E_VM_USER }}
          SSHPASS: ${{ secrets.E2E_VM_PASSWORD }}
          E2E_ACME_EMAIL: ${{ secrets.E2E_ACME_EMAIL }}
          E2E_VM_KNOWN_HOSTS: /home/runner/.ssh/mcp-runtime-e2e-known-hosts
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
          E2E_RUN_MULTITENANCY: ${{ inputs.run-multitenancy && '1' || '0' }}
        run: bash test/e2e/production-remote.sh

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-e2e-remote-artifacts
          path: e2e-artifacts
