name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-release-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  BINARY_NAME: mcp-runtime

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set release metadata
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev"
          fi
          {
            echo "VERSION=${version}"
            echo "COMMIT=${GITHUB_SHA}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_ENV}"

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist

          if [ "${GOOS}" = "windows" ]; then
            output="dist/${BINARY_NAME}-${GOOS}-${GOARCH}.exe"
          else
            output="dist/${BINARY_NAME}-${GOOS}-${GOARCH}"
          fi

          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${BUILD_DATE}" \
            -o "${output}" \
            ./cmd/mcp-runtime

      - name: Smoke test Linux amd64 binary
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          ./dist/${BINARY_NAME}-linux-amd64 --version | grep -F "${VERSION}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-runtime-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: find dist -type f | sort

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            mcp-runtime-darwin-arm64
            mcp-runtime-darwin-amd64
            mcp-runtime-linux-arm64
            mcp-runtime-linux-amd64
            mcp-runtime-windows-amd64.exe
          )
          for asset in "${expected[@]}"; do
            if [[ ! -s "dist/${asset}" ]]; then
              echo "Missing or empty release asset: ${asset}" >&2
              exit 1
            fi
          done
          actual_count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "${actual_count}" != "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} release assets, found ${actual_count}" >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: MCP Runtime ${{ github.ref_name }}
          body: |
            ## Try it

            Download the `mcp-runtime` CLI binary for your platform:

            - [macOS Apple Silicon](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mcp-runtime-darwin-arm64)
            - [macOS Intel](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mcp-runtime-darwin-amd64)
            - [Linux amd64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mcp-runtime-linux-amd64)
            - [Linux arm64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mcp-runtime-linux-arm64)
            - [Windows amd64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mcp-runtime-windows-amd64.exe)

            Install and setup guide: https://mcpruntime.org/docs/getting-started/
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
