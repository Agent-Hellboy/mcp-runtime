apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-runtime-api-platform-egress
  namespace: mcp-sentinel
spec:
  podSelector:
    matchLabels:
      app: mcp-runtime-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mcp-platform-api
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: clickhouse
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 4317
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
    # The Kubernetes API server is not reachable by pod selector on every
    # distribution: k3s runs it as an embedded host process with no Pod at all,
    # and kubeadm runs it as a static pod in kube-system labelled
    # component: kube-apiserver, not component: apiserver in default. Selecting
    # it by label therefore matches nothing and silently denies API egress,
    # which breaks registry push (it resolves namespaces through the API).
    # Allow the service-facing 443 and the host-facing 6443 port. k3s exposes
    # the kubernetes ClusterIP on 443 but forwards to its embedded API server
    # on 6443 before the network policy is evaluated on some CNIs.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443 # MCP_KUBERNETES_API_PORT
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
